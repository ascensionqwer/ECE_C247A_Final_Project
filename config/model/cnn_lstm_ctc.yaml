# @package _global_
# Hybrid CNN+LSTM Architecture for EMG-to-Keystroke Prediction

module:
  _target_: emg2qwerty.lightning.CNNLSTMCTCModule
  in_features: 1056  # freq * bands * channels = (64 // 2 + 1) * 2 * 16
  cnn_channels: [64, 128]
  kernel_size: 3
  lstm_hidden: 128
  lstm_layers: 1

datamodule:
  _target_: emg2qwerty.lightning.WindowedEMGDataModule
  window_length: 8000
  padding: [1800, 200]

