# @package _global_
# LSTM with 1 Electrode Channel (Ablation Study)

module:
  _target_: emg2qwerty.lightning.LSTMCTCModule
  in_features: 66  # (64 // 2 + 1) * 2 bands * 1 channel
  hidden_size: 128
  num_layers: 2
  dropout: 0.3
  electrode_channels: 1

datamodule:
  _target_: emg2qwerty.lightning.WindowedEMGDataModule
  window_length: 8000
  padding: [1800, 200]

to_tensor:
  _target_: emg2qwerty.transforms.ToTensor
  fields:
  - emg_left
  - emg_right

band_rotation:
  _target_: emg2qwerty.transforms.ForEach
  transform:
    _target_: emg2qwerty.transforms.RandomBandRotation
    offsets:
    - -1
    - 0
    - 1

temporal_jitter:
  _target_: emg2qwerty.transforms.TemporalAlignmentJitter
  max_offset: 120

logspec:
  _target_: emg2qwerty.transforms.LogSpectrogram
  n_fft: 64
  hop_length: 16

specaug:
  _target_: emg2qwerty.transforms.SpecAugment
  n_time_masks: 3
  time_mask_param: 25
  n_freq_masks: 2
  freq_mask_param: 4

transforms:
  train:
  - ${to_tensor}
  - _target_: emg2qwerty.transforms.SelectChannels
    channels: [0]
  - ${band_rotation}
  - ${temporal_jitter}
  - ${logspec}
  - ${specaug}
  val:
  - ${to_tensor}
  - _target_: emg2qwerty.transforms.SelectChannels
    channels: [0]
  - ${logspec}
  test: ${transforms.val}

