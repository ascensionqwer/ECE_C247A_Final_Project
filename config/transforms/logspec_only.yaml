# @package _global_
to_tensor:
  _target_: emg2qwerty.transforms.ToTensor
  fields: [emg_left, emg_right]

channel_select:
  _target_: emg2qwerty.transforms.SelectEMGChannels
  n_channels: null

downsample:
  _target_: emg2qwerty.transforms.TemporalDownsample
  factor: 1

logspec:
  _target_: emg2qwerty.transforms.LogSpectrogram
  n_fft: 64
  hop_length: 16

transforms:
  train:
    - ${to_tensor}
    - ${channel_select}
    - ${downsample}
    - ${logspec}

  val:
    - ${to_tensor}
    - ${channel_select}
    - ${downsample}
    - ${logspec}

  test: ${transforms.val}
